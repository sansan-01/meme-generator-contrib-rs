name: Compile Contrib Library for Rust 1.88.0 on Ubuntu 22.04

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev

      - name: Install Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Build
        run: cargo +1.88.0 build --locked --release

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libmeme-generator-contrib-so-1.88.0
          path: target/release/libmeme_generator_contrib.so
          if-no-files-found: error
